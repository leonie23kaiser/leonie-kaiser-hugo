baseURL = 'https://leoniekaiser.com/'
languageCode = 'de-AT'
defaultContentLanguage = 'de'
title = 'KI & Digitalisierung für Praxen – Strategie & EU AI Act | Leonie Kaiser'

enableRobotsTXT = true
enableGitInfo = true
enableEmoji = true

disableKinds = ["taxonomy", "term"]

[markup.goldmark.renderer]
  unsafe = true

[frontmatter]
  # enableGitInfo=true machte Hugos Standard-lastmod-Kaskade sonst den Git-Commit-Zeitpunkt
  # nutzen statt des im Front-Matter gesetzten Redaktionsdatums ("Aktualisiert"-Anzeige
  # zeigte das Commit-Datum statt des gepflegten lastmod-Werts). Jetzt zählt ausschließlich
  # das Front-Matter.
  lastmod = ["lastmod", "date"]

[permalinks]
  journal = "/blog/:slug/"

[outputs]
  home = ['HTML','RSS']

[imaging]
  quality = 82
  resampleFilter = 'Lanczos'

[minify]
  minifyOutput = true

[sitemap]
  changefreq = 'monthly'
  priority = 0.7
  filename = 'sitemap.xml'
